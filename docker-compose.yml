version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: pgvector/pgvector:pg16
    container_name: smm_postgres
    restart: unless-stopped
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: k3YSvvqo0gwQVCwHCoLklzei-Ht6JsTT
      POSTGRES_DB: social_media_marketing
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - smm_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Serverpod Backend Server
  backend:
    build:
      context: ./social_media_marketing_server
      dockerfile: Dockerfile
    container_name: smm_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8081:8081"
      - "8082:8082"
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=social_media_marketing
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=k3YSvvqo0gwQVCwHCoLklzei-Ht6JsTT
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - smm_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Flutter Web Frontend
  frontend:
    build:
      context: ./social_media_marketing_flutter
      dockerfile: Dockerfile
    container_name: smm_frontend
    restart: unless-stopped
    ports:
      - "4129:80"
    depends_on:
      - backend
    networks:
      - smm_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

networks:
  smm_network:
    driver: bridge
